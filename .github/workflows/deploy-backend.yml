name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - 'Dockerfile'

jobs:
  deploy:
    name: Trigger Render Docker Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Render hook
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
